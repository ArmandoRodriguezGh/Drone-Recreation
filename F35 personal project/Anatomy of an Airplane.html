  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

1406\" x2=\"535\" y2=\"1418\"><\u002Fline>\n<line x1=\"585\" y1=\"1406\" x2=\"575\" y2=\"1418\"><\u002Fline>\n<line x1=\"625\" y1=\"1406\" x2=\"615\" y2=\"1418\"><\u002Fline>\n<line x1=\"665\" y1=\"1406\" x2=\"655\" y2=\"1418\"><\u002Fline>\n<line x1=\"705\" y1=\"1406\" x2=\"695\" y2=\"1418\"><\u002Fline>\n<line x1=\"745\" y1=\"1406\" x2=\"735\" y2=\"1418\"><\u002Fline>\n<line x1=\"785\" y1=\"1406\" x2=\"775\" y2=\"1418\"><\u002Fline>\n<\u002Fg>\n\n<g stroke=\"#f2b84b\" stroke-width=\"1.5\">\n<line x1=\"620\" y1=\"940\" x2=\"680\" y2=\"895\"><\u002Fline>\n<line x1=\"660\" y1=\"720\" x2=\"720\" y2=\"782\"><\u002Fline>\n<line x1=\"880\" y1=\"980\" x2=\"880\" y2=\"915\"><\u002Fline>\n<line x1=\"1060\" y1=\"505\" x2=\"1125\" y2=\"560\"><\u002Fline>\n<line x1=\"1400\" y1=\"680\" x2=\"1290\" y2=\"675\"><\u002Fline>\n<line x1=\"1110\" y1=\"1050\" x2=\"1175\" y2=\"1030\"><\u002Fline>\n<line x1=\"1450\" y1=\"515\" x2=\"1355\" y2=\"515\"><\u002Fline>\n<line x1=\"1225\" y1=\"365\" x2=\"1285\" y2=\"388\"><\u002Fline>\n<line x1=\"800\" y1=\"585\" x2=\"870\" y2=\"630\"><\u002Fline>\n<line x1=\"765\" y1=\"1330\" x2=\"712\" y2=\"1295\"><\u002Fline>\n<line x1=\"1720\" y1=\"1074\" x2=\"1720\" y2=\"1050\"><\u002Fline>\n<line x1=\"1650\" y1=\"770\" x2=\"1712\" y2=\"800\"><\u002Fline>\n<line x1=\"1625\" y1=\"440\" x2=\"1676\" y2=\"478\"><\u002Fline>\n<\u002Fg>\n<g fill=\"#f2b84b\" stroke=\"#0d2540\" stroke-width=\"3\">\n<circle cx=\"620\" cy=\"940\" r=\"18\"><\u002Fcircle>\n<circle cx=\"660\" cy=\"720\" r=\"18\"><\u002Fcircle>\n<circle cx=\"880\" cy=\"980\" r=\"18\"><\u002Fcircle>\n<circle cx=\"1110\" cy=\"690\" r=\"18\"><\u002Fcircle>\n<circle cx=\"1060\" cy=\"505\" r=\"18\"><\u002Fcircle>\n<circle cx=\"1400\" cy=\"680\" r=\"18\"><\u002Fcircle>\n<circle cx=\"1110\" cy=\"1050\" r=\"18\"><\u002Fcircle>\n<circle cx=\"1450\" cy=\"515\" r=\"18\"><\u002Fcircle>\n<circle cx=\"1225\" cy=\"365\" r=\"18\"><\u002Fcircle>\n<circle cx=\"800\" cy=\"585\" r=\"18\"><\u002Fcircle>\n<circle cx=\"765\" cy=\"1330\" r=\"18\"><\u002Fcircle>\n<circle cx=\"1720\" cy=\"1074\" r=\"18\"><\u002Fcircle>\n<circle cx=\"1650\" cy=\"770\" r=\"18\"><\u002Fcircle>\n<circle cx=\"1625\" cy=\"440\" r=\"18\"><\u002Fcircle>\n<\u002Fg>\n<g fill=\"#0d2540\" font-family=\"Barlow Condensed, sans-serif\" font-weight=\"700\" font-size=\"19\" text-anchor=\"middle\" dominant-baseline=\"central\">\n<text x=\"620\" y=\"941\">1<\u002Ftext>\n<text x=\"660\" y=\"721\">2<\u002Ftext>\n<text x=\"880\" y=\"981\">3<\u002Ftext>\n<text x=\"1110\" y=\"691\">4<\u002Ftext>\n<text x=\"1060\" y=\"506\">5<\u002Ftext>\n<text x=\"1400\" y=\"681\">6<\u002Ftext>\n<text x=\"1110\" y=\"1051\">7<\u002Ftext>\n<text x=\"1450\" y=\"516\">8<\u002Ftext>\n<text x=\"1225\" y=\"366\">9<\u002Ftext>\n<text x=\"800\" y=\"586\">10<\u002Ftext>\n<text x=\"765\" y=\"1331\">11<\u002Ftext>\n<text x=\"1720\" y=\"1075\">12<\u002Ftext>\n<text x=\"1650\" y=\"771\">13<\u002Ftext>\n<text x=\"1625\" y=\"441\">14<\u002Ftext>\n<\u002Fg>\n<g fill=\"#8fb6d9\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\" letter-spacing=\"1\">\n<text x=\"1872\" y=\"866\" text-anchor=\"end\">℄<\u002Ftext>\n<text x=\"612\" y=\"1480\">NOSE ←  PLAN VIEW, FROM ABOVE  → TAIL<\u002Ftext>\n<\u002Fg>\n<\u002Fsvg>\n\n<div style=\"position: absolute; left: 64px; top: 56px; width: 1400px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.18em; color: #8fb6d9\">PLATE 01 · EXPLODED ASSEMBLY · SWEPT-WING TWIN-ENGINE TRANSPORT<\u002Fdiv>\n<h1 style=\"margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 96px; line-height: 0.95; letter-spacing: 0.02em; color: #ffffff; text-transform: uppercase\">Anatomy of an Airplane<\u002Fh1>\n<p style=\"margin: 0; font-size: 19px; line-height: 28px; color: #d5e3f0; max-width: 1180px\">Fourteen components pulled apart along their attachment lines — what each is called and why, what it does, the quirk worth remembering, and how it shapes the flow around the vehicle.<\u002Fp>\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 15px; line-height: 22px; color: #f2b84b\">airplane ← Fr. aéroplane ← Gk. aēr “air” + planos “wandering” (or Fr. planer, “to glide”)<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"position: absolute; left: 1600px; top: 72px; width: 736px; box-sizing: border-box; padding: 20px 24px; border: 1px solid #2e5579; border-radius: 6px; background: #12304f; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.16em; color: #8fb6d9\">HOW TO READ THIS PLATE<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; font-size: 14px; line-height: 20px\">\n<div style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 22px; height: 14px; flex: none; border: 2px solid #cfe3f5; background: rgba(207,227,245,0.15); box-sizing: border-box\"><\u002Fspan><span>Primary structure<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 22px; height: 14px; flex: none; border: 2px solid #f2b84b; background: rgba(242,184,75,0.3); box-sizing: border-box\"><\u002Fspan><span>Control &amp; high-lift surfaces<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 22px; height: 14px; flex: none; border: 2px solid #ff8f6b; background: rgba(255,143,107,0.22); box-sizing: border-box\"><\u002Fspan><span>Propulsion<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 14px; line-height: 20px; color: #d5e3f0\">Dashed lines show where each part fits back on. Every card gives its <b style=\"color: #f2b84b; font-weight: 600\">ROOT<\u002Fb> (etymology), then <b style=\"color: #8fb6d9; font-weight: 600\">USE<\u002Fb>, <b style=\"color: #8fb6d9; font-weight: 600\">QUIRK<\u002Fb> and <b style=\"color: #8fb6d9; font-weight: 600\">AERO<\u002Fb> (its effect on the flow).<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"position: absolute; left: 64px; top: 300px; width: 420px; height: 300px; box-sizing: border-box; padding: 18px 22px; background: #12304f; border: 1px solid #2e5579; border-radius: 6px; display: flex; flex-direction: column; gap: 7px\">\n<div style=\"display: flex; align-items: center; gap: 12px\"><span style=\"width: 32px; height: 32px; flex: none; border-radius: 16px; background: #f2b84b; color: #0d2540; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 19px\">1<\u002Fspan><h2 style=\"margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; color: #ffffff\">Radome &amp; Cockpit<\u002Fh2><\u002Fdiv>\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 17px; color: #f2b84b\">radome = radar + dome (1940s) · cockpit ← 1580s pit for cockfighting, later a warship’s junior-officers’ quarters<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">USE <\u002Fb>The nose cone houses the weather radar; behind it the flight deck holds crew, instruments and controls.<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">QUIRK <\u002Fb>The radome is fiberglass or composite, not aluminum — metal would block the radar beam.<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">AERO <\u002Fb>Sets the stagnation point where the flow splits; a smooth taper lets pressure recover gently so the boundary layer stays attached.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"position: absolute; left: 64px; top: 616px; width: 420px; height: 300px; box-sizing: border-box; padding: 18px 22px; background: #12304f; border: 1px solid #2e5579; border-radius: 6px; display: flex; flex-direction: column; gap: 7px\">\n<div style=\"display: flex; align-items: center; gap: 12px\"><span style=\"width: 32px; height: 32px; flex: none; border-radius: 16px; background: #f2b84b; color: #0d2540; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 19px\">2<\u002Fspan><h2 style=\"margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; color: #ffffff\">Pitot Tube<\u002Fh2><\u002Fdiv>\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 17px; color: #f2b84b\">eponym · Henri Pitot, French engineer who used one to gauge the Seine’s current in 1732<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">USE <\u002Fb>Senses total pressure; paired with static ports it gives airspeed from q = p<sub>t<\u002Fsub> − p<sub>s<\u002Fsub> = ½ρV².<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">QUIRK <\u002Fb>Electrically heated against ice — iced-over pitots fed false airspeeds in the 2009 Air France 447 accident.<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">AERO <\u002Fb>Measures the flow rather than shaping it; it is mounted where local flow is clean so the reading tracks the freestream.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"position: absolute; left: 64px; top: 932px; width: 420px; height: 300px; box-sizing: border-box; padding: 18px 22px; background: #12304f; border: 1px solid #2e5579; border-radius: 6px; display: flex; flex-direction: column; gap: 7px\">\n<div style=\"display: flex; align-items: center; gap: 12px\"><span style=\"width: 32px; height: 32px; flex: none; border-radius: 16px; background: #f2b84b; color: #0d2540; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 19px\">3<\u002Fspan><h2 style=\"margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; color: #ffffff\">Fuselage<\u002Fh2><\u002Fdiv>\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 17px; color: #f2b84b\">Fr. fuselé “spindle-shaped” ← fuseau “spindle” ← Lat. fusus<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">USE <\u002Fb>The structural backbone: carries crew and payload and ties the wings to the tail.<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">QUIRK <\u002Fb>Semi-monocoque: the skin itself carries load. As a pressure vessel, every pressurization cycle counts against its fatigue life.<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">AERO <\u002Fb>Little lift, lots of skin-friction and form drag; a high fineness ratio (long and slender) keeps parasite drag down.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"position: absolute; left: 64px; top: 1248px; width: 420px; height: 300px; box-sizing: border-box; padding: 18px 22px; background: #12304f; border: 1px solid #2e5579; border-radius: 6px; display: flex; flex-direction: column; gap: 7px\">\n<div style=\"display: flex; align-items: center; gap: 12px\"><span style=\"width: 32px; height: 32px; flex: none; border-radius: 16px; background: #f2b84b; color: #0d2540; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 19px\">4<\u002Fspan><h2 style=\"margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; color: #ffffff\">Wing · Airfoil<\u002Fh2><\u002Fdiv>\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 17px; color: #f2b84b\">wing ← ON vængr · airfoil = air + foil ← Lat. folium “leaf”<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">USE <\u002Fb>Makes the lift, L = ½ρV²S·C<sub>L<\u002Fsub>. Its internal wing box also holds most of the fuel.<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">QUIRK <\u002Fb>A “wet wing” puts fuel weight right where the lift is, relieving the bending moment at the root.<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">AERO <\u002Fb>Camber and angle of attack set lift; sweep delays shocks near Mach 1; high aspect ratio cuts induced drag; dihedral adds roll stability.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"position: absolute; left: 1916px; top: 300px; width: 420px; height: 300px; box-sizing: border-box; padding: 18px 22px; background: #12304f; border: 1px solid #2e5579; border-radius: 6px; display: flex; flex-direction: column; gap: 7px\">\n<div style=\"display: flex; align-items: center; gap: 12px\"><span style=\"width: 32px; height: 32px; flex: none; border-radius: 16px; background: #f2b84b; color: #0d2540; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 19px\">5<\u002Fspan><h2 style=\"margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; color: #ffffff\">Leading-Edge Slats<\u002Fh2><\u002Fdiv>\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 17px; color: #f2b84b\">slat ← OFr. esclat “splinter, fragment” (modern éclat)<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">USE <\u002Fb>Slide forward and down off the leading edge for takeoff and landing.<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">QUIRK <\u002Fb>Early Handley Page automatic slats needed no actuator — suction at high angle of attack pulled them open.<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">AERO <\u002Fb>The slot feeds high-energy air over the upper surface, keeping flow attached and pushing the stall to a higher angle of attack.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"position: absolute; left: 1916px; top: 616px; width: 420px; height: 300px; box-sizing: border-box; padding: 18px 22px; background: #12304f; border: 1px solid #2e5579; border-radius: 6px; display: flex; flex-direction: column; gap: 7px\">\n<div style=\"display: flex; align-items: center; gap: 12px\"><span style=\"width: 32px; height: 32px; flex: none; border-radius: 16px; background: #f2b84b; color: #0d2540; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 19px\">6<\u002Fspan><h2 style=\"margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; color: #ffffff\">Flaps<\u002Fh2><\u002Fdiv>\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 17px; color: #f2b84b\">ME flappe — imitative, the sound of a slap<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">USE <\u002Fb>Trailing-edge high-lift devices for slow flight: takeoff, approach and landing.<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">QUIRK <\u002Fb>Fowler flaps roll aft on tracks before drooping, adding area as well as camber; the canoe-shaped fairings under an airliner’s wing hide those tracks.<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">AERO <\u002Fb>Raise C<sub>L,max<\u002Fsub> and lower stall speed, at the cost of drag and a nose-down pitching moment the tail must trim out.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"position: absolute; left: 1916px; top: 932px; width: 420px; height: 300px; box-sizing: border-box; padding: 18px 22px; background: #12304f; border: 1px solid #2e5579; border-radius: 6px; display: flex; flex-direction: column; gap: 7px\">\n<div style=\"display: flex; align-items: center; gap: 12px\"><span style=\"width: 32px; height: 32px; flex: none; border-radius: 16px; background: #f2b84b; color: #0d2540; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 19px\">7<\u002Fspan><h2 style=\"margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; color: #ffffff\">Spoilers<\u002Fh2><\u002Fdiv>\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 17px; color: #f2b84b\">spoil ← OFr. espoillier ← Lat. spoliare “to strip, plunder”<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">USE <\u002Fb>Upper-surface panels that rise to dump lift: speedbrake in flight, roll assist, ground spoilers at touchdown.<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">QUIRK <\u002Fb>On landing they deploy automatically, shifting weight onto the wheels so the brakes can actually grip.<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">AERO <\u002Fb>Deliberately separate the flow — literally “spoiling” lift and adding drag over part of the span.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"position: absolute; left: 1916px; top: 1248px; width: 420px; height: 300px; box-sizing: border-box; padding: 18px 22px; background: #12304f; border: 1px solid #2e5579; border-radius: 6px; display: flex; flex-direction: column; gap: 7px\">\n<div style=\"display: flex; align-items: center; gap: 12px\"><span style=\"width: 32px; height: 32px; flex: none; border-radius: 16px; background: #f2b84b; color: #0d2540; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 19px\">8<\u002Fspan><h2 style=\"margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; color: #ffffff\">Ailerons<\u002Fh2><\u002Fdiv>\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 17px; color: #f2b84b\">Fr. aileron “little wing” ← aile “wing” ← Lat. ala<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">USE <\u002Fb>Deflect in opposite directions to roll the airplane about its longitudinal axis.<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">QUIRK <\u002Fb>Adverse yaw: the down aileron makes more lift and more induced drag, dragging the nose away from the turn. Rudder, differential or Frise ailerons cancel it.<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">AERO <\u002Fb>Change local camber so lift becomes asymmetric across the span.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"position: absolute; left: 64px; top: 1580px; width: 362px; height: 340px; box-sizing: border-box; padding: 18px 20px; background: #12304f; border: 1px solid #2e5579; border-radius: 6px; display: flex; flex-direction: column; gap: 7px\">\n<div style=\"display: flex; align-items: center; gap: 12px\"><span style=\"width: 32px; height: 32px; flex: none; border-radius: 16px; background: #f2b84b; color: #0d2540; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 19px\">9<\u002Fspan><h2 style=\"margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; color: #ffffff\">Winglet<\u002Fh2><\u002Fdiv>\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 17px; color: #f2b84b\">wing + -let (diminutive) · developed by NASA’s Richard Whitcomb in the 1970s<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">USE <\u002Fb>An upturned tip that recovers energy otherwise lost to the wingtip vortex.<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">QUIRK <\u002Fb>Pays off most on long cruise legs; on short hops its weight and extra wing bending can eat the gain.<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">AERO <\u002Fb>High-pressure air under the wing curls around the tip to the low-pressure top; the winglet weakens that vortex, cutting induced drag much like extra span.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"position: absolute; left: 446px; top: 1580px; width: 362px; height: 340px; box-sizing: border-box; padding: 18px 20px; background: #12304f; border: 1px solid #2e5579; border-radius: 6px; display: flex; flex-direction: column; gap: 7px\">\n<div style=\"display: flex; align-items: center; gap: 12px\"><span style=\"width: 32px; height: 32px; flex: none; border-radius: 16px; background: #ff8f6b; color: #0d2540; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 19px\">10<\u002Fspan><h2 style=\"margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; color: #ffffff\">Nacelle &amp; Pylon<\u002Fh2><\u002Fdiv>\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 17px; color: #f2b84b\">nacelle ← Fr. “small boat” ← Lat. navicella ← navis “ship” · pylon ← Gk. pylōn “gateway”<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">USE <\u002Fb>The nacelle fairs the engine; the pylon hangs it ahead of and below the wing.<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">QUIRK <\u002Fb>In a high-bypass turbofan most thrust comes from the fan, not the core. Engine mass hung forward also helps damp wing flutter.<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">AERO <\u002Fb>Supplies thrust but adds interference drag at the wing–pylon joint; small nacelle strakes shed a vortex that keeps flow on the wing at high angle of attack.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"position: absolute; left: 828px; top: 1580px; width: 362px; height: 340px; box-sizing: border-box; padding: 18px 20px; background: #12304f; border: 1px solid #2e5579; border-radius: 6px; display: flex; flex-direction: column; gap: 7px\">\n<div style=\"display: flex; align-items: center; gap: 12px\"><span style=\"width: 32px; height: 32px; flex: none; border-radius: 16px; background: #f2b84b; color: #0d2540; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 19px\">11<\u002Fspan><h2 style=\"margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; color: #ffffff\">Landing Gear<\u002Fh2><\u002Fdiv>\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 17px; color: #f2b84b\">a.k.a. undercarriage · gear ← ON gervi “equipment” · oleo strut ← Lat. oleum “oil”<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">USE <\u002Fb>Carries the airplane on the ground, absorbs touchdown, steers (nose gear) and brakes (mains).<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">QUIRK <\u002Fb>Oleo-pneumatic struts push oil through an orifice against compressed nitrogen: a spring and a damper in one tube.<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">AERO <\u002Fb>Extended, it is a major parasite-drag source — why fast airplanes retract it, and why lowering it is part of slowing down on approach.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"position: absolute; left: 1210px; top: 1580px; width: 362px; height: 340px; box-sizing: border-box; padding: 18px 20px; background: #12304f; border: 1px solid #2e5579; border-radius: 6px; display: flex; flex-direction: column; gap: 7px\">\n<div style=\"display: flex; align-items: center; gap: 12px\"><span style=\"width: 32px; height: 32px; flex: none; border-radius: 16px; background: #f2b84b; color: #0d2540; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 19px\">12<\u002Fspan><h2 style=\"margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; color: #ffffff\">Empennage<\u002Fh2><\u002Fdiv>\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 17px; color: #f2b84b\">Fr. empenner “to feather an arrow” ← penne “feather” ← Lat. penna<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">USE <\u002Fb>The whole tail group: horizontal and vertical stabilizers plus their control surfaces (dashed outline, 12).<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">QUIRK <\u002Fb>Named for arrow fletching — and it works the same way, putting area far behind the center of gravity.<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">AERO <\u002Fb>On its long moment arm, any disturbance creates a restoring moment that weathervanes the nose back to the relative wind: static stability in pitch and yaw.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"position: absolute; left: 1592px; top: 1580px; width: 362px; height: 340px; box-sizing: border-box; padding: 18px 20px; background: #12304f; border: 1px solid #2e5579; border-radius: 6px; display: flex; flex-direction: column; gap: 7px\">\n<div style=\"display: flex; align-items: center; gap: 12px\"><span style=\"width: 32px; height: 32px; flex: none; border-radius: 16px; background: #f2b84b; color: #0d2540; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 19px\">13<\u002Fspan><h2 style=\"margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; color: #ffffff\">H. Stabilizer &amp; Elevator<\u002Fh2><\u002Fdiv>\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 17px; color: #f2b84b\">stabilis “standing firm” (Lat.) · elevator ← Lat. elevare “to lift up” ← levis “light”<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">USE <\u002Fb>The stabilizer gives pitch stability; the elevator controls pitch about the lateral axis.<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">QUIRK <\u002Fb>On most airliners the tail pushes down to balance a nose-heavy layout, and the whole stabilizer moves to trim.<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">AERO <\u002Fb>That down-load means the wing must lift slightly more than the airplane weighs — a penalty called trim drag.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"position: absolute; left: 1974px; top: 1580px; width: 362px; height: 340px; box-sizing: border-box; padding: 18px 20px; background: #12304f; border: 1px solid #2e5579; border-radius: 6px; display: flex; flex-direction: column; gap: 7px\">\n<div style=\"display: flex; align-items: center; gap: 12px\"><span style=\"width: 32px; height: 32px; flex: none; border-radius: 16px; background: #f2b84b; color: #0d2540; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 19px\">14<\u002Fspan><h2 style=\"margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; color: #ffffff\">V. Stabilizer &amp; Rudder<\u002Fh2><\u002Fdiv>\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 17px; color: #f2b84b\">fin ← OE finn · rudder ← OE rōþor “paddle, oar”<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">USE <\u002Fb>The fin gives directional stability; the rudder controls yaw about the vertical axis.<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">QUIRK <\u002Fb>The rudder doesn’t turn the airplane — banking does. It coordinates turns, fights crosswinds, and is sized to hold an engine-out.<\u002Fp>\n<p style=\"margin: 0; font-size: 13.5px; line-height: 19px; color: #d5e3f0\"><b style=\"color: #8fb6d9; font-weight: 600; font-size: 11px; letter-spacing: 0.1em\">AERO <\u002Fb>A symmetric airfoil set on edge: sideslip gives it an angle of attack, and its side force swings the nose back into the wind.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"position: absolute; left: 64px; top: 1956px; width: 1124px; height: 220px; box-sizing: border-box; padding: 20px 24px; border: 1px solid #2e5579; border-radius: 6px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; align-items: baseline; gap: 16px\"><h2 style=\"margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: 0.04em; text-transform: uppercase; color: #ffffff\">Three Axes<\u002Fh2><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8fb6d9; letter-spacing: 0.1em\">ALL THROUGH THE CENTER OF GRAVITY<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\"><b style=\"font-family: 'Barlow Condensed', sans-serif; font-size: 24px; color: #ffffff; letter-spacing: 0.04em\">ROLL<\u002Fb><span style=\"font-size: 14px; line-height: 20px\">Longitudinal axis, nose to tail · <b style=\"color: #f2b84b; font-weight: 600\">ailerons (8)<\u002Fb><\u002Fspan><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 17px; color: #f2b84b\">← OFr. roller ← Lat. rotula “little wheel”<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\"><b style=\"font-family: 'Barlow Condensed', sans-serif; font-size: 24px; color: #ffffff; letter-spacing: 0.04em\">PITCH<\u002Fb><span style=\"font-size: 14px; line-height: 20px\">Lateral axis, wingtip to wingtip · <b style=\"color: #f2b84b; font-weight: 600\">elevator (13)<\u002Fb><\u002Fspan><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 17px; color: #f2b84b\">← ME picchen “to thrust, set”; a ship’s bow pitching<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\"><b style=\"font-family: 'Barlow Condensed', sans-serif; font-size: 24px; color: #ffffff; letter-spacing: 0.04em\">YAW<\u002Fb><span style=\"font-size: 14px; line-height: 20px\">Vertical axis, top to bottom · <b style=\"color: #f2b84b; font-weight: 600\">rudder (14)<\u002Fb><\u002Fspan><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 17px; color: #f2b84b\">nautical, 1500s; origin unknown<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"position: absolute; left: 1212px; top: 1956px; width: 1124px; height: 220px; box-sizing: border-box; padding: 20px 24px; border: 1px solid #2e5579; border-radius: 6px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; align-items: baseline; gap: 16px\"><h2 style=\"margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: 0.04em; text-transform: uppercase; color: #ffffff\">Four Forces<\u002Fh2><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8fb6d9; letter-spacing: 0.1em\">STEADY LEVEL FLIGHT: L = W, T = D<\u002Fspan><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\"><b style=\"font-family: 'Barlow Condensed', sans-serif; font-size: 24px; color: #ffffff; letter-spacing: 0.04em\">LIFT<\u002Fb><span style=\"font-size: 14px; line-height: 20px\">L = ½ρV²S·C<sub>L<\u002Fsub><\u002Fspan><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 17px; color: #f2b84b\">← ON lypta, from lopt “air, sky”<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\"><b style=\"font-family: 'Barlow Condensed', sans-serif; font-size: 24px; color: #ffffff; letter-spacing: 0.04em\">WEIGHT<\u002Fb><span style=\"font-size: 14px; line-height: 20px\">W = mg<\u002Fspan><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 17px; color: #f2b84b\">← OE gewiht<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\"><b style=\"font-family: 'Barlow Condensed', sans-serif; font-size: 24px; color: #ffffff; letter-spacing: 0.04em\">THRUST<\u002Fb><span style=\"font-size: 14px; line-height: 20px\">T ≈ ṁ(V<sub>e<\u002Fsub> − V<sub>0<\u002Fsub>)<\u002Fspan><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 17px; color: #f2b84b\">← ON þrýsta “to press”<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\"><b style=\"font-family: 'Barlow Condensed', sans-serif; font-size: 24px; color: #ffffff; letter-spacing: 0.04em\">DRAG<\u002Fb><span style=\"font-size: 14px; line-height: 20px\">D = ½ρV²S(C<sub>D0<\u002Fsub> + C<sub>L<\u002Fsub>²/πeAR)<\u002Fspan><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 17px; color: #f2b84b\">← OE dragan “to draw”<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:2400,&quot;height&quot;:2240}}\">\nclass Component extends DCLogic {\nrenderVals() {\nreturn {};\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
